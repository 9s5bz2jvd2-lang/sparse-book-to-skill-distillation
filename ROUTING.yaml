# ROUTING.yaml — 稀疏蒸馏 / Book-to-Skill Sparse Distillation
# Purpose: machine/agent-readable hints for sparse-first activation, missed-case sweep,
# budgeted references, and cache-friendly invocation. Values are guidance, not hard runtime API.

role: router_and_distillation_workflow
activation_model: "shared-core + top-k routed experts + missed-case sweep"
distillation_model: "full extraction + progressive disclosure (L0-L3)"

trigger_terms:
  strong:
    - 稀疏蒸馏
    - 图书蒸馏
    - book-to-skill
    - textbook distillation
    - 把一本书蒸馏成 skill
    - 把长资料蒸馏成 skill
    - DeepSeek 稀疏激活
    - MoE 式 Skill 调用
    - sparse activation skill
    - missed-case sweep
    - 漏诊式扫查
    - 预算化引用
    - Skill Graph
    - ROUTING.yaml
    - CACHE.md
    - GRAPH.md
  weak:
    - Orange Book 转 Skill
    - 方法论沉淀
    - 长文档变工作流
    - 课程蒸馏
    - 大型 Skill 库
    - progressive disclosure
    - route logs
    - cache-friendly prompt
    - shared core
    - top-k experts

anti_triggers:
  - 只要普通摘要
  - 只要读后感
  - 只问一个事实点
  - 要复制整本书原文
  - 要绕过版权购买资料
  - 只是保存私有项目事实
  - 没有复用价值的一次性报告

neighbors:
  upstream:
    - 归一
    - skills-manual
    - textbook-distillation
  safety:
    - anti-hallucination-academic-writing
    - nutrition-history-anti-hallucination
    - food-agent-methodology
  adjacent:
    - nutrition-ai-productization
    - yuanjiang-nutrition-production-line
    - 万物生
    - 圆酱营养科普生产线
  output:
    - html-report
    - lingtai-issue-report

budget:
  # 蒸馏阶段：全量产出，不设预算限制
  distillation:
    mode: "full extraction"
    layers: ["L0_signature", "L1_brief", "L2_standard", "L3_full"]
    rule: "不采样、不跳过，所有层全部生成"
  # 调用阶段：稀疏激活，按层加载
  runtime:
    shared_core:
      target_tokens: "200-800"
      cache_tier: stable_prefix
      loads_layer: "L1"
    source_map:
      target_tokens: "500-1500"
      cache_tier: stable_or_reference_brief
      loads_layer: "L0"
    routed_expert:
      target_tokens: "800-3000"
      cache_tier: variable_by_task
      loads_layer: "L2"
    missed_case_sweep:
      target_tokens: "200-800"
      cache_tier: stable_checklist
    heavy_reference:
      target_tokens: "on-demand only"
      cache_tier: variable_suffix
      loads_layer: "L3"
    evals:
      target_tokens: "small examples, loaded when testing"
      cache_tier: reference

sparse_activation:
  default_top_k: 2
  max_top_k: 5
  progressive_disclosure:
    rule: "蒸馏全量产出 L0-L3，调用时逐层加载"
    layers:
      L0_signature:
        tokens: "50-100"
        when: "路由匹配，不加载正文"
      L1_brief:
        tokens: "200-500"
        when: "快速回答，不需展开"
      L2_standard:
        tokens: "800-3000"
        when: "标准任务执行"
      L3_full:
        tokens: "unlimited"
        when: "验收失败 / 深度引用 / 人类要求全量"
    escalation: "L0 → L1 → L2 → L3，只在当前层无法通过验收门时升级"
  rules:
    - "Always load shared core first."
    - "Select only the strongest expert nodes for the main workflow."
    - "Use low-budget neighbor sweep instead of loading all adjacent skills."
    - "Escalate to heavy references only when the task cannot pass acceptance checks without them."
    - "For high-risk domains, include safety/evidence gate even if it is not the top semantic match."

missed_case_sweep:
  required:
    - copyright_and_source_boundary
    - private_information_boundary
    - hallucinated_source_check
    - anti_trigger_check
    - adjacent_skill_check
    - safety_or_evidence_gate_if_high_risk
    - output_contract_check
  high_risk_extra:
    - medical_or_nutrition_scope
    - special_population
    - referral_or_professional_boundary
    - stigma_or_shame_language
    - citation_verifiability

route_log_fields:
  - task_summary
  - source_type
  - selected_experts
  - skipped_experts
  - sweep_items_checked
  - sweep_hits
  - references_loaded
  - scripts_used
  - budget_tier
  - output_artifacts
  - followup_needed
