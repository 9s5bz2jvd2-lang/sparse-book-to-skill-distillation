# Compatibility locator only; JSON artifacts/contracts are normative.
skill_version: "3.0.0"
contract_version: "2.0.0"

# Design core (conceptual guidance, not a runtime field contract):
# 网给 skill 以通达，环给 skill 以低功耗；分支出去，回流成丹。
design_core:
  network: "cross-linked shared-core/expert/atom graph + multidimensional vectors give point-to-point reachability"
  ring: "short signature hit -> one bounded closure -> exact load -> residual-bank return; routing cost must stay below saved cost; small tasks execute directly"
  sphere: "a branch is complete only when it returns as compressed reusable structure (signature/checklist/gotcha/eval)"
  activation_model: "shared-core + cross-linked top-k routed experts + missed-case sweep + budgeted references + cache-friendly layout + cyclic return-to-cache feedback loop"
  status_boundary: "residual bank inner return loop is executable; signature/cache self-modification is not implemented; outer improvement is human-gated (docs/self-evolution-loop.md); the routing-cost/direct-execution gate is caller/evaluation protocol, not automatic runtime enforcement"
phase_1_full_distillation:
  source_manifest_schema: contracts/source-manifest.v2.schema.json
  work_queue_schema: contracts/work-queue.v2.schema.json
  distilled_chunk_schema: contracts/distilled-chunk.v2.schema.json
  source_map_schema: contracts/source-map.v2.schema.json
  agent_semantic_step: required_for_every_chunk_by_agent_or_human
phase_2_sparse_reading:
  routing_policy: contracts/routing-policy.v2.json
  built_registry_schema: contracts/expert-registry.v2.schema.json
  built_index_schema: contracts/expert-index.v2.schema.json
  query_request_schema: contracts/query-request.v2.schema.json
  query_output_schema: contracts/query-output.v2.schema.json
  reference_implementation: scripts/query.py
  mandatory_post_route_safety_sweep: true

# Expert IDs, triggers, anti-triggers, L0-L3 content, and provenance do not live here.
# They are derived into each workspace's registry/index only after complete validation.
